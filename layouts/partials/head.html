<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="description" content="{{ .Site.Params.description }}">
  <meta name="author" content="{{ .Site.Params.author }}">
  <meta name="theme-color" content="{{ .Site.Params.theme_color }}">

  <!--  Open Graph -->
  <meta property="og:url" content="{{ .Site.BaseURL }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ .Site.Title }}">
  <meta property="og:description" content="{{ .Site.Params.description }}">
  <meta property="og:image" content="{{ .Site.BaseURL }}{{ .Site.Params.og_image }}">
  <meta property="og:site_name" content="{{ .Site.Params.description }}">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ .Site.Title }}">
  <meta name="twitter:url" content="{{ .Site.BaseURL }}">
  <meta name="twitter:site" content="{{ .Site.Params.twitter_site }}">
  <meta name="twitter:description" content="{{ .Site.Params.description }}">
  <meta name="twitter:image" content="{{ .Site.BaseURL }}{{ .Site.Params.twitter_image }}">

  <title>{{ .Site.Title }}</title>

  <link rel="shortcut icon" href="{{ "favicon.png" | relURL }}">

  <!-- Preconnect to external origins -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

  <!-- Custom fonts for this template -->
  <link href="{{ "assets/fonts/saira-extra-condensed-500-700.css" | relURL }}" rel="stylesheet">
  <link href="{{ "assets/fonts/muli-400-400i-800-800i.css" | relURL }}" rel="stylesheet">

  <!-- Fontawesome stylesheets -->
  <link href="{{ "assets/icons/css/fontawesome.min.css" | relURL }}" rel="stylesheet">
  <link href="{{ "assets/icons/css/brands.min.css" | relURL }}" rel="stylesheet">
  <link href="{{ "assets/icons/css/solid.min.css" | relURL }}" rel="stylesheet">

  <!-- Custom styles -->
  <link href="{{ "assets/css/constants.css" | relURL }}" rel="stylesheet">
  <link href="{{ "assets/css/resume.css" | relURL }}" rel="stylesheet">
</head>
