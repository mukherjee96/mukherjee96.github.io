<section class="resume-section p-3 p-lg-5 d-flex align-items-center" id="skills">
  <div class="w-100">
    <h2 class="mb-5">Skills</h2>

    <div class="container">
      <div class="row">
        {{ range .Site.Data.skills.categories }}
        <div class="col-sm">
          <div class="subheading mb-3">{{ .title }}</div>
          <ul class="{{ .list_class }}">
            {{ range .items }}
            <li>
              <i class="fa-li fas fa-check"></i>
              {{ . }}
            </li>
            {{ end }}
          </ul>
        </div>
        {{ end }}
      </div>
    </div>
  </div>
</section>
